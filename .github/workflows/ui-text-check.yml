name: UI Text Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-text:
    name: Arayüz Metni Türkçe mi?
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # bdmind'de kullanıcı YALNIZCA Türkçe metin görmelidir. Denetleyici,
      # AST üzerinden görünen arayüz metinlerini tarar ve baseline dışı
      # İngilizce bulursa başarısız olur (bkz. scripts/check-ui-text.ts).
      - name: Check user-visible text is Turkish
        run: npm run check:ui-text
